// ─── QR CODE SVG (deterministic) ──────────────────────────────────────────────
const QRCodeSVG=({value,size=140})=>{
  const N=21,pad=7,cell=(size-pad*2)/N;
  let h=5381;for(let i=0;i<value.length;i++)h=((h<<5)+h)^value.charCodeAt(i);h=Math.abs(h);
  const inFP=(r,c)=>(r<7&&c<7)||(r<7&&c>=N-7)||(r>=N-7&&c<7);
  const fpDark=(r,c)=>{
    const d=(r0,c0)=>{const dr=r-r0,dc=c-c0;return(dr===0||dr===6||dc===0||dc===6)||(dr>=2&&dr<=4&&dc>=2&&dc<=4);};
    return r<7&&c<7?d(0,0):r<7?d(0,N-7):d(N-7,0);
  };
  const dark=(r,c)=>{
    if(inFP(r,c))return fpDark(r,c);
    if(r===6)return c%2===0;if(c===6)return r%2===0;
    return !!(((h>>>((r*N+c)%29))&1)^((h>>>((r*N+c)%17+5))&1));
  };
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{background:"#fff",borderRadius:8,display:"block"}}>
      {Array.from({length:N},(_,r)=>Array.from({length:N},(_,c)=>
        dark(r,c)&&<rect key={`${r},${c}`} x={pad+c*cell} y={pad+r*cell} width={cell} height={cell} fill="#0d0d14"/>
      ))}
    </svg>
  );
};

const matchVacancy=(text,resumeSkills=[])=>{
  const words=(text.toLowerCase().match(/[а-яёa-z]{4,}/g)||[]);
  const sk=resumeSkills.map((s,i)=>({id:`sk${i}`,type:"skill",name:s,tags:[s.toLowerCase().replace(/[^\wа-яё ]/g,"")],verified:false,tx:null,issuer:null,year:null}));
  return [...ALL_ACHIEVEMENTS,...sk]
    .map(it=>{
      const hay=(it.name+" "+(it.tags||[]).join(" ")).toLowerCase();
      const hits=words.filter(w=>hay.includes(w)).length;
      const pseudo=Math.abs(Math.sin(it.id.length*13+7)*18+8);
      return{...it,relevance:Math.min(100,hits*22+pseudo)};
    })
    .filter(it=>it.relevance>=25)
    .sort((a,b)=>b.relevance-a.relevance)
    .slice(0,Math.max(4,Math.ceil(([...ALL_ACHIEVEMENTS,...sk].length)*0.65)));
};

// ─── PROFILE CONSTRUCTOR (multi-step share wizard) ────────────────────────────
const ProfileConstructor=({onClose,resumes,user,onGrant,preselectedId})=>{
  const [step,setStep]=useState(1);
  const [mode,setMode]=useState(null);
  const [aTab,setATab]=useState("text");
  const [vacUrl,setVacUrl]=useState("");
  const [vacText,setVacText]=useState("");
  const [vacTitle,setVacTitle]=useState("");
  const [analyzing,setAnalyzing]=useState(false);
  const [suggestions,setSuggestions]=useState([]);
  const [selIds,setSelIds]=useState(new Set());
  const [employer,setEmployer]=useState("");
  const [empEmail,setEmpEmail]=useState("");
  const [selResume,setSelResume]=useState(preselectedId||resumes[0]?.id||"");
  const [accessDays,setAccessDays]=useState(30);
  const [link,setLink]=useState("");
  const [copied,setCopied]=useState(false);

  const curResume=resumes.find(r=>r.id===Number(selResume))||resumes[0];
  const resumeSkills=curResume?.skills||[];
  const allItems=[...ALL_ACHIEVEMENTS,...resumeSkills.map((s,i)=>({id:`sk${i}`,type:"skill",name:s,verified:false,tx:null,issuer:null,year:null,tags:[s.toLowerCase()]}))];
  const toggleSel=id=>setSelIds(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
  const selCount=selIds.size;

  const analyze=()=>{
    setAnalyzing(true);
    const src=aTab==="url"?`product manager strategy roadmap agile analytics ${vacUrl}`:vacText;
    setTimeout(()=>{
      const res=matchVacancy(src,resumeSkills);
      setSuggestions(res);
      setSelIds(new Set(res.map(i=>i.id)));
      setVacTitle(aTab==="url"?decodeURIComponent(vacUrl.split("/").filter(Boolean).pop()||"Вакансия").slice(0,40):"Из описания");
      setAnalyzing(false);setStep(3);
    },2000);
  };

  const generate=()=>{
    if(!employer||!empEmail)return;
    const l=genLink();setLink(l);
    const items=mode==="auto"?suggestions.filter(i=>selIds.has(i.id)):allItems.filter(i=>selIds.has(i.id));
    onGrant({employer,email:empEmail,resumeId:Number(selResume),link:l,items,mode,itemCount:selCount});
    setStep(4);
  };

  const openPreview=()=>{
    const items=mode==="auto"?suggestions.filter(i=>selIds.has(i.id)):allItems.filter(i=>selIds.has(i.id));
    const ms=mode==="auto"&&suggestions.length?Math.round(suggestions.filter(i=>selIds.has(i.id)).reduce((a,i)=>a+(i.relevance||0),0)/Math.max(1,selIds.size)):null;
    const html=buildEmployerPage({candidateName:user?.name||"Кандидат",targetRole:curResume?.title||"Специалист",mode,items,matchScore:ms,vacancyTitle:vacTitle,link,expiry:accessDays===0?"Бессрочно":`${accessDays} дней`});
    const win=window.open("","_blank");
    if(win){win.document.open();win.document.write(html);win.document.close();}
  };

  const copyLink=()=>{try{navigator.clipboard?.writeText(link).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});}catch(e){}};

  const STEPS=["Режим","Подбор","Детали","Результат"];
  const dayOpts=[{v:7,l:"7 дн"},{v:30,l:"30 дн"},{v:90,l:"90 дн"},{v:0,l:"∞"}];

  return (
    <Modal onClose={onClose} width={580}>
      {/* Breadcrumb */}
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:20,paddingBottom:16,borderBottom:`0.5px solid ${G.border}`}}>
        {STEPS.map((s,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:6}}>

// ─── RADAR CHART ──────────────────────────────────────────────────────────────
const RadarChart=({data,color=G.accent,size=240})=>{
  const cx=size/2,cy=size/2,r=size*0.38,n=data.length;
  const angle=i=>(i*2*Math.PI)/n-Math.PI/2;
  const pt=(i,v)=>({x:cx+r*(v/100)*Math.cos(angle(i)),y:cy+r*(v/100)*Math.sin(angle(i))});
  const gridPts=s=>data.map((_,i)=>`${cx+r*s*Math.cos(angle(i))},${cy+r*s*Math.sin(angle(i))}`).join(" ");
  const vp=data.map((d,i)=>pt(i,d.value));
  const path=vp.map((p,i)=>`${i===0?"M":"L"}${p.x},${p.y}`).join(" ")+"Z";
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {[20,40,60,80,100].map(s=><polygon key={s} points={gridPts(s/100)} fill="none" stroke={G.border} strokeWidth={0.5}/>)}
      {data.map((_,i)=><line key={i} x1={cx} y1={cy} x2={cx+r*Math.cos(angle(i))} y2={cy+r*Math.sin(angle(i))} stroke={G.border} strokeWidth={0.5}/>)}
      <path d={path} fill={`${color}22`} stroke={color} strokeWidth={1.5}/>
      {data.map((d,i)=>{const p=pt(i,d.value);const lx=cx+(r+18)*Math.cos(angle(i)),ly=cy+(r+18)*Math.sin(angle(i));return (<g key={i}><circle cx={p.x} cy={p.y} r={3} fill={color}/><text x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fontSize={9} fill={G.textSecondary} fontFamily="Inter">{d.label}</text></g>);})}
    </svg>
  );
};

      {tab==="account"&&(<div style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:20}}><Card style={{width:200,alignSelf:"start"}}><div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:12}}><div style={{width:80,height:80,borderRadius:"50%",background:`linear-gradient(135deg,${G.accent},${G.purple})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,color:"#fff",fontWeight:700}}>{user.name.split(" ").map(n=>n[0]).join("").slice(0,2)}</div><div style={{textAlign:"center"}}><div style={{fontSize:14,fontWeight:500}}>{user.name}</div><div style={{fontSize:12,color:G.textMuted}}>{user.email}</div></div><Badge color="green">Верифицирован</Badge><Btn variant="secondary" size="sm">Изменить фото</Btn></div></Card><Card><div style={{fontSize:14,fontWeight:500,marginBottom:16}}>Личные данные</div><div style={{display:"flex",flexDirection:"column",gap:14}}><Input label="Полное имя" value={name} onChange={setName}/><Input label="Email" value={email} onChange={setEmail} type="email"/><Input label="Местоположение" value={location} onChange={setLocation}/><Input label="О себе" value={bio} onChange={setBio} multiline rows={3}/><Btn style={{alignSelf:"flex-start"}}>Сохранить изменения</Btn></div></Card></div>)}
      {tab==="web2"&&(<div style={{maxWidth:560,display:"flex",flexDirection:"column",gap:16}}><div style={{padding:"12px 16px",borderRadius:8,background:G.accentLighter,border:`0.5px solid rgba(81,120,255,0.2)`,fontSize:13,color:G.textSecondary}}>Привяжите аккаунты Web 2.0 для быстрого входа и верификации личности. Больше привязанных аккаунтов — выше уровень доверия профиля.</div><Card><div style={{fontSize:14,fontWeight:500,marginBottom:4}}>Web 2.0 сервисы</div><div style={{fontSize:12,color:G.textSecondary,marginBottom:16}}>Привязанные аккаунты используются для входа без пароля и повышения доверия</div><div style={{display:"flex",flexDirection:"column",gap:10}}>{WEB2_PROVIDERS.map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:14,padding:"12px 14px",borderRadius:10,background:w2[p.id]?G.accentLighter:G.bg,border:`0.5px solid ${w2[p.id]?G.accent:G.border}`,transition:"all 0.2s"}}><div style={{width:36,height:36,borderRadius:10,background:p.bg,display:"flex",alignItems:"center",justifyContent:"center",color:p.tc,fontSize:14,fontWeight:700,flexShrink:0}}>{p.icon}</div><div style={{flex:1}}><div style={{fontSize:13,fontWeight:500}}>{p.label}</div><div style={{fontSize:11,color:G.textMuted}}>{p.desc}</div>{w2[p.id]&&<div style={{fontSize:10,color:G.green,marginTop:2}}>✓ Привязан</div>}</div><Btn variant={w2[p.id]?"danger":"secondary"} size="sm" onClick={()=>toggleW2(p.id)}>{w2[p.id]?"Отвязать":"Привязать"}</Btn></div>)}</div></Card>{linked>0&&<div style={{padding:"14px 16px",borderRadius:8,background:G.greenLight,border:`0.5px solid rgba(59,202,110,0.25)`}}><div style={{fontSize:13,color:G.green,fontWeight:500,marginBottom:8}}>Уровень доверия профиля</div><ProgressBar value={Math.min(100,linked*18+10)} color={G.green} height={8}/><div style={{fontSize:12,color:G.textSecondary,marginTop:6}}>Привязано {linked} из {WEB2_PROVIDERS.length} сервисов · {Math.min(100,linked*18+10)}% доверия</div></div>}</div>)}
      {tab==="web3"&&(<Card style={{maxWidth:480}}><div style={{fontSize:14,fontWeight:500,marginBottom:16}}>Web 3.0 идентификация</div><div style={{display:"flex",flexDirection:"column",gap:14}}>{[{name:"MetaMask",icon:"🦊",desc:"Ethereum кошелёк"},{name:"WalletConnect",icon:"🔗",desc:"Universal wallet"},{name:"Phantom",icon:"👻",desc:"Solana кошелёк"}].map(w=><div key={w.name} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:8,background:G.bg,border:`0.5px solid ${G.border}`}}><span style={{fontSize:20}}>{w.icon}</span><div style={{flex:1}}><div style={{fontSize:13,fontWeight:500}}>{w.name}</div><div style={{fontSize:11,color:G.textMuted}}>{w.desc}</div></div><Btn variant={web3Connected?"success":"secondary"} size="sm" onClick={()=>setWeb3Connected(!web3Connected)}>{web3Connected?"✓ Подключён":"Подключить"}</Btn></div>)}{web3Connected&&<div style={{padding:"10px 14px",borderRadius:8,background:G.greenLight,border:`0.5px solid rgba(59,202,110,0.25)`}}><div style={{fontSize:12,color:G.green,fontWeight:500,marginBottom:2}}>Кошелёк подключён</div><div style={{fontSize:11,fontFamily:"'JetBrains Mono',monospace",color:G.textMuted}}>0x7f9a...4c2b</div></div>}</div></Card>)}
      {tab==="privacy"&&(<Card style={{maxWidth:480}}><div style={{fontSize:14,fontWeight:500,marginBottom:16}}>Настройки приватности</div><div style={{display:"flex",flexDirection:"column",gap:16}}><Toggle value={visibility} onChange={setVisibility} label="Профиль виден в публичном поиске"/><div style={{height:"0.5px",background:G.border}}/><Toggle value={true} onChange={()=>{}} label="Показывать статистику компетенций"/><Toggle value={false} onChange={()=>{}} label="Анонимный режим (скрыть имя)"/><Toggle value={true} onChange={()=>{}} label="Разрешить просмотр работодателями"/><div style={{height:"0.5px",background:G.border}}/><div style={{padding:12,borderRadius:8,background:G.redLight,border:`0.5px solid rgba(232,70,70,0.25)`}}><div style={{fontSize:13,fontWeight:500,color:G.red,marginBottom:4}}>Удалить аккаунт</div><div style={{fontSize:12,color:G.textSecondary,marginBottom:10}}>Все данные будут удалены безвозвратно</div><Btn variant="danger" size="sm">Удалить аккаунт</Btn></div></div></Card>)}
      {tab==="notifications"&&(<Card style={{maxWidth:480}}><div style={{fontSize:14,fontWeight:500,marginBottom:16}}>Уведомления</div><div style={{display:"flex",flexDirection:"column",gap:14}}>{[["Просмотр профиля работодателем",true],["Новые рекомендации по навыкам",true],["Обновления верификации документов",true],["Новые курсы по моим пробелам",false],["Дайджест еженедельный",false]].map(([label,val],i)=><div key={i}><Toggle value={!!val} onChange={()=>{}} label={label}/>{i<4&&<div style={{height:"0.5px",background:G.border,marginTop:14}}/>}</div>)}</div></Card>)}
    </div>
  );
};

// ─── ROOT ──────────────────────────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(null);
  const [view,setView]=useState("dashboard");
  const [resumes,setResumes]=useState([]);
  const [selectedResume,setSelectedResume]=useState(null);
  const [shares,setShares]=useState([
    {id:1,employer:"Яндекс",email:"hr@yandex.ru",resume:"Senior Product Manager",resumeId:null,grantedAt:"12.04.2025, 09:23",lastView:"18.04.2025",active:true,views:4,mode:"auto",itemCount:6},
    {id:2,employer:"Тинькофф",email:"talent@tinkoff.ru",resume:"Senior Product Manager",resumeId:null,grantedAt:"05.03.2025, 14:11",lastView:"07.03.2025",active:true,views:2,mode:"manual",itemCount:4},
    {id:3,employer:"VK Tech",email:"jobs@vk.com",resume:"Senior Product Manager",resumeId:null,grantedAt:"20.01.2025, 11:00",lastView:"22.01.2025",active:false,views:1,mode:"auto",itemCount:5},
  ]);

  if(!user)return(<><style>{css}</style><AuthScreen onLogin={u=>setUser(u)}/></>);

  const renderView=()=>{
    if(view==="resume-detail"&&selectedResume)
      return <ResumeDetail resume={selectedResume} onBack={()=>{setView("resumes");setSelectedResume(null);}} resumes={resumes} shares={shares} setShares={setShares} user={user}/>;
    switch(view){
      case"dashboard":   return <Dashboard setView={setView} resumes={resumes} shares={shares}/>;
      case"resumes":     return <ResumesView resumes={resumes} setResumes={setResumes} setSelectedResume={setSelectedResume} setView={setView}/>;
      case"credentials": return <CredentialsView/>;
      case"analytics":   return <AnalyticsView resumes={resumes}/>;
      case"sharing":     return <SharingView resumes={resumes} shares={shares} setShares={setShares} user={user}/>;
      case"profile":     return <ProfileView user={user}/>;
      default:           return <Dashboard setView={setView} resumes={resumes} shares={shares}/>;
    }
  };

  return(
    <><style>{css}</style>
      <div style={{display:"flex",minHeight:"100vh",background:G.bg}}>
        <Sidebar view={view} setView={v=>{setView(v);setSelectedResume(null);}} user={user}/>
        <div style={{flex:1,overflowY:"auto",minHeight:"100vh"}}>{renderView()}</div>
      </div>
    </>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
